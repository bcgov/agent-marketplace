name: PR

# Runs on every pull request. Four jobs, three phases:
#   1. fork-gate  — records fork provenance; subsequent checks are read-only
#      and do not receive secrets or execute contributed package content.
#   2. lint-tests — formats, lints, and unit-tests the tooling that produces
#      skills (scripts/, tests/, pyproject.toml). Runs after fork-gate: if the
#      generator is broken, validating skill output is meaningless.
#   3. skills     — validates the SKILL.md profiles the PR changed. Gated on
#      lint-tests passing.
#   4. results    — always runs (`if: always()`), needs every other job, and
#      fails if any of them failed or was cancelled. This is the SINGLE
#      required status check on `main`, so we can add or rename jobs in this
#      file without touching branch protection.
#
# Action pinning policy:
#   * First-party actions owned by GitHub (actions/*) are pinned to a major
#     version tag — GitHub guarantees those tags forward-only. Easier to read,
#     Dependabot still bumps majors.
#   * Third-party actions are pinned to an immutable commit SHA with the
#     human-readable version in a trailing comment, so a tag hijack cannot
#     silently swap the action's code under us. Dependabot bumps these too.

on:
  pull_request:

# Least privilege: every job here only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on the same PR (a force-push or new commit makes the
# in-flight run's results stale). Use the base repository and stable PR number
# so forks with the same branch name stay independent. Pushes outside a
# PR (this workflow doesn't trigger on `push`, but the guard is defensive)
# would fall back to ${{ github.ref }}.
concurrency:
  group: pr-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 0. Record fork provenance without granting secrets or write permissions.
  fork-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Record PR source
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Read-only validation for $HEAD_REPO targeting $BASE_REPO"

  # 1. Validate the codebase that produces skills — runs before skill validation.
  lint-tests:
    needs: fork-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so we can diff against the base branch

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
          enable-cache: true

      - name: Check Python formatting (2-space, double quotes)
        run: uv run ruff format --check .

      - name: Lint Python (style, imports, docstrings)
        run: uv run ruff check .

      - name: Run unit tests
        run: uv run pytest -q tests/

      - name: Flag Extension path renames for review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-status -M "$BASE_SHA" HEAD -- skills prompts instructions agents |
            awk -F '\t' '$1 ~ /^R/ {
              print "Extension path rename: " $2 " -> " $3
              print "- Extension path rename: `" $2 "` -> `" $3 "`; found=1
            }' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run Security-owned policy fixtures
        run: uv run pytest -q tests/security-policy/

  # 2. Validate the skill profiles the PR changed — only after codebase passes.
  skills:
    needs: lint-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so we can diff against the base branch

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
          enable-cache: true

      - name: Validate changed skills
        run: uv run python scripts/validate_skill.py --base "origin/${{ github.base_ref }}"

  # Validate repository-backed marketplace records and generated docs. Package
  # files are scanned as data; contributed scripts are never invoked here.
  marketplace:
    needs: lint-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.19"
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check security policy and summarize findings
        run: uv run python scripts/marketplace.py check

      - name: Validate marketplace packages and generated projections
        run: uv run python scripts/marketplace.py validate

      - name: Regenerate and check CODEOWNERS
        run: |
          uv run python scripts/marketplace.py generate
          git diff --exit-code -- .github/CODEOWNERS

      - name: Build documentation
        run: bash docs/build.sh

      - name: Reject generated documentation drift
        run: git diff --exit-code -- catalog docs

  # 3. Aggregator. Always runs (even if upstream jobs failed or were cancelled)
  #    and fails if any required job failed or was cancelled. Branch protection
  #    only needs to require THIS one check — adding or renaming jobs above
  #    never requires updating branch protection again.
  #
  #    Note: a `skipped` result is treated as a pass on purpose, so jobs we add
  #    later with an `if:` filter (e.g. "only on changes to X") don't false-fail
  #    the gate when they intentionally don't run.
  results:
    if: always()
    needs: [fork-gate, lint-tests, skills, marketplace]
    runs-on: ubuntu-24.04
    steps:
      - uses: bcgov/actions/workflow-results@79aefe3a7abb2d0d00b1b3ea4cfbf12727a10638 # v0.9.0
        with:
          needs: ${{ toJson(needs) }}
