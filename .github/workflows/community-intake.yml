name: Community intake

# Every active asset contributor must be identified by GitHub as a member of the bcgov
# GitHub organization. Community packages also pass anti-abuse checks before
# they may auto-publish; specialty packages still require human review. This
# workflow never publishes anything itself.
#
# Community intake decisions live in Python (marketplace.py intake) and are
# unit-tested. This workflow gathers the GitHub author association used for eligibility.

on:
  pull_request:

# Deny-all baseline. The single job opts in to the narrow tokens it needs.
permissions: {}

concurrency:
  group: community-intake-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  intake:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: write
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect active asset changes
        id: changes
        run: |
          set -euo pipefail

          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          ACTIVE_ASSETS="$(printf '%s\n' "$CHANGED" \
            | grep -E '^(skills|prompts|instructions|agents)/' || true)"
          COMMUNITY_ASSETS="$(printf '%s\n' "$CHANGED" \
            | grep -E '^(skills|prompts|instructions|agents)/community/' || true)"

          if [ -n "$ACTIVE_ASSETS" ]; then
            echo "has_assets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$COMMUNITY_ASSETS" ]; then
            echo "has_community=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_community=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.changes.outputs.has_community == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Verify contributor organization membership
        id: membership
        if: steps.changes.outputs.has_assets == 'true'
        run: |
          set -euo pipefail

          if [ "$AUTHOR_ASSOCIATION" = "MEMBER" ]; then
            echo "member=yes" >> "$GITHUB_OUTPUT"
            echo "GitHub identifies the contributor as a bcgov organization member."
            exit 0
          fi

          echo "::error::GitHub author association '${AUTHOR_ASSOCIATION}' is not MEMBER; active asset contributions require a bcgov organization member."
          exit 1

      - name: Hold community auto-publish pending the new-package gate
        id: signals
        if: steps.changes.outputs.has_community == 'true'
        run: |
          echo "trust=yes" >> "$GITHUB_OUTPUT"
          echo "velocity=unknown" >> "$GITHUB_OUTPUT"

      - name: Decide intake for each changed community package
        id: decide
        if: steps.changes.outputs.has_community == 'true'
        run: |
          set -euo pipefail
          TRUST="${{ steps.signals.outputs.trust }}"
          VELOCITY="${{ steps.signals.outputs.velocity }}"

          # Changed community package directories (one bcgov-extension.yaml each).
          mapfile -t PKGS < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -E '^(skills|prompts|instructions|agents)/community/[^/]+/bcgov-extension\.yaml$' \
            | xargs -r -n1 dirname | sort -u)

          if [ "${#PKGS[@]}" -eq 0 ]; then
            echo "No community package manifests changed."
            exit 0
          fi

          HELD=0
          {
            echo "## Community intake"
            echo ""
            echo "| Package | Risk | Scan | Decision |"
            echo "|---------|------|------|----------|"
          } >> "$GITHUB_STEP_SUMMARY"

          for pkg in "${PKGS[@]}"; do
            OUT="$(uv run --project . python scripts/marketplace.py intake "$pkg" \
              --author-trust "$TRUST" --velocity "$VELOCITY")"
            ID="$(echo "$OUT" | uv run --project . python -c 'import json,sys;print(json.load(sys.stdin)["id"])')"
            RISK="$(echo "$OUT" | uv run --project . python -c 'import json,sys;print(json.load(sys.stdin)["risk"])')"
            SCAN="$(echo "$OUT" | uv run --project . python -c 'import json,sys;print(json.load(sys.stdin)["scan-outcome"])')"
            DECISION="$(echo "$OUT" | uv run --project . python -c 'import json,sys;print(json.load(sys.stdin)["intake"]["decision"])')"
            echo "| \`$ID\` | $RISK | $SCAN | **$DECISION** |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$DECISION" != "auto-publish" ]; then HELD=1; fi
          done

          if [ "$HELD" -eq 1 ]; then
            gh pr edit "${{ github.event.pull_request.number }}" \
              --add-label "community-intake:hold" || true
            echo "One or more community packages must wait for a maintainer." >&2
            exit 1
          fi

          gh pr edit "${{ github.event.pull_request.number }}" \
            --remove-label "community-intake:hold" || true
          echo "All changed community packages are eligible to auto-publish."
