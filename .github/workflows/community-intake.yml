name: Community intake

# Every active asset contributor must be a confirmed member of the bcgov
# GitHub organization. Community packages also pass anti-abuse checks before
# they may auto-publish; specialty packages still require human review. This
# workflow never publishes anything itself.
#
# Community intake decisions live in Python (marketplace.py intake) and are
# unit-tested. This workflow gathers the live GitHub signals they need.

on:
  pull_request:

# Deny-all baseline. The single job opts in to the narrow tokens it needs.
permissions: {}

concurrency:
  group: community-intake-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  intake:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: write
    env:
      AUTHOR: ${{ github.event.pull_request.user.login }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ORG: bcgov
      # Must read org membership and search the author's open PRs. The default
      # job token is a fallback only; inability to confirm membership blocks
      # the PR and emits a diagnostic.
      GH_TOKEN: ${{ secrets.ORG_READ_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect active asset changes
        id: changes
        run: |
          set -euo pipefail

          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          ACTIVE_ASSETS="$(printf '%s\n' "$CHANGED" \
            | grep -E '^(skills|prompts|instructions|agents)/' || true)"
          COMMUNITY_ASSETS="$(printf '%s\n' "$CHANGED" \
            | grep -E '^(skills|prompts|instructions|agents)/community/' || true)"

          if [ -n "$ACTIVE_ASSETS" ]; then
            echo "has_assets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$COMMUNITY_ASSETS" ]; then
            echo "has_community=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_community=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.changes.outputs.has_community == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Verify contributor organization membership
        id: membership
        if: steps.changes.outputs.has_assets == 'true'
        run: |
          set -euo pipefail

          set +e
          RESPONSE="$(gh api --include "orgs/${ORG}/members/${AUTHOR}" 2>&1)"
          API_EXIT=$?
          set -e

          if [ "$API_EXIT" -eq 0 ]; then
            echo "member=yes" >> "$GITHUB_OUTPUT"
            echo "Contributor membership confirmed for ${ORG}."
            exit 0
          fi

          HTTP_STATUS="$(printf '%s\n' "$RESPONSE" \
            | sed -nE 's#^HTTP/[0-9.]+[[:space:]]+([0-9]{3}).*#\1#p' \
            | head -n 1)"
          if [ "$HTTP_STATUS" = "404" ]; then
            echo "::error::GitHub returned 404 for the membership check. This means either the author is not a bcgov member or ORG_READ_TOKEN cannot read organization membership. Configure ORG_READ_TOKEN with bcgov Members: read permission (or classic read:org scope), then rerun."
          elif [ -n "$HTTP_STATUS" ]; then
            echo "::error::Could not verify bcgov membership (GitHub HTTP ${HTTP_STATUS}). Check ORG_READ_TOKEN permissions, organization approval/SSO, token expiry, and GitHub API rate limits."
          else
            echo "::error::Could not reach the GitHub membership API. Check the workflow token and GitHub Actions network/API availability."
          fi
          exit 1

      - name: Resolve author trust and velocity signals
        id: signals
        if: steps.changes.outputs.has_community == 'true'
        run: |
          set -euo pipefail

          # Read the thresholds straight from the single source of truth.
          read_cfg() {
            uv run --project . python - "$1" <<'PY'
          import re, sys
          key = sys.argv[1]
          text = open("config/marketplace.yaml").read()
          m = re.search(rf"^\s*{re.escape(key)}:\s*(\S+)\s*$", text, re.M)
          print(m.group(1).strip('"\'') if m else "")
          PY
          }
          MIN_AGE="$(read_cfg min-account-age-days)"
          MAX_OPEN="$(read_cfg max-open-submissions-per-author)"

          # Account age is measured from account creation (the public API does not
          # expose org-join date). This is a documented proxy in
          # docs/COMMUNITY_INTAKE_POLICY.md.
          CREATED_AT="$(gh api "users/${AUTHOR}" --jq .created_at)"
          AGE_DAYS=$(( ( $(date -u +%s) - $(date -u -d "$CREATED_AT" +%s) ) / 86400 ))

          # Open community submissions by this author (velocity signal).
          OPEN_PRS="$(gh api -X GET search/issues \
            -f q="repo:${GITHUB_REPOSITORY} is:pr is:open author:${AUTHOR}" \
            --jq .total_count)"

          TRUST=yes
          if [ "$AGE_DAYS" -lt "$MIN_AGE" ]; then TRUST=no; fi

          VELOCITY=ok
          if [ "$OPEN_PRS" -gt "$MAX_OPEN" ]; then VELOCITY=exceeded; fi

          echo "trust=$TRUST" >> "$GITHUB_OUTPUT"
          echo "velocity=$VELOCITY" >> "$GITHUB_OUTPUT"
          echo "Author=$AUTHOR age=${AGE_DAYS}d org_member=yes open_prs=$OPEN_PRS -> trust=$TRUST velocity=$VELOCITY"

      - name: Decide intake for each changed community package
        id: decide
        if: steps.changes.outputs.has_community == 'true'
        run: |
          set -euo pipefail
          TRUST="${{ steps.signals.outputs.trust }}"
          VELOCITY="${{ steps.signals.outputs.velocity }}"

          # Changed community package directories (one bcgov-extension.yaml each).
          mapfile -t PKGS < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -E '^(skills|prompts|instructions|agents)/community/[^/]+/bcgov-extension\.yaml$' \
            | xargs -r -n1 dirname | sort -u)

          if [ "${#PKGS[@]}" -eq 0 ]; then
            echo "No community package manifests changed."
            exit 0
          fi

          HELD=0
          {
            echo "## Community intake"
            echo ""
            echo "| Package | Risk | Scan | Decision |"
            echo "|---------|------|------|----------|"
          } >> "$GITHUB_STEP_SUMMARY"

          for pkg in "${PKGS[@]}"; do
            OUT="$(uv run --project . python scripts/marketplace.py intake "$pkg" \
              --author-trust "$TRUST" --velocity "$VELOCITY")"
            ID="$(echo "$OUT" | uv run --project . python -c 'import json,sys;print(json.load(sys.stdin)["id"])')"
            RISK="$(echo "$OUT" | uv run --project . python -c 'import json,sys;print(json.load(sys.stdin)["risk"])')"
            SCAN="$(echo "$OUT" | uv run --project . python -c 'import json,sys;print(json.load(sys.stdin)["scan-outcome"])')"
            DECISION="$(echo "$OUT" | uv run --project . python -c 'import json,sys;print(json.load(sys.stdin)["intake"]["decision"])')"
            echo "| \`$ID\` | $RISK | $SCAN | **$DECISION** |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$DECISION" != "auto-publish" ]; then HELD=1; fi
          done

          if [ "$HELD" -eq 1 ]; then
            gh pr edit "${{ github.event.pull_request.number }}" \
              --add-label "community-intake:hold" || true
            echo "One or more community packages must wait for a maintainer." >&2
            exit 1
          fi

          gh pr edit "${{ github.event.pull_request.number }}" \
            --remove-label "community-intake:hold" || true
          echo "All changed community packages are eligible to auto-publish."
