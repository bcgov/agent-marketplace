display-name: n8n Runbook Parser
summary: Extract code from prose runbooks into version-controlled snippets, detect drift, and backport reviewed fixes to source documentation.
maintainers:
  - "@mishraomp"
  - "@DerekRoberts"
prerequisites:
  - Python 3.12 or newer
  - Read access to each configured source document
capabilities:
  filesystem:
    read:
      - configured runbooks and workspace parser configuration
    write:
      - generated snippets and parser state after confirmation
  network:
    - "*"
  commands:
    - python
    - shellcheck
    - jq
    - bash
    - doc_links.py
    - parser.py
    - rb_commands.py
    - rb_config.py
    - rb_log.py
    - rb_markdown.py
    - rb_model.py
    - rb_reconstruct.py
    - rb_seal.py
  # Includes shell-local/template variable references recognized by the static scan.
  environment-variables:
    - RUNBOOK_PARSER_CACHE
    - CHECK
    - FOO
    - GROUP
    - HERE
    - NAMESPACE
    - PARAM
    - PRIMARY_POD
    - PRODUCT_VERSION
    - SEP
    - VAR
  secret-names: []
  data-classes:
    - INTERNAL
