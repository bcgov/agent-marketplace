schema-version: bcgov-extension/v1alpha1
id: bcgov-public/bcgov-create-extension
display-name: BC Gov Create Extension
summary: Author, validate, preview, and submit BC Gov agent extension candidates.
publisher: Province of British Columbia
maintainers:
  - "@mishraomp"
  - "@DerekRoberts"
support: https://github.com/bcgov/agent-marketplace/issues
license: Apache-2.0
