display-name: OpenShift Deployment
summary: Design BC Gov Private Cloud workload manifests with appropriate controllers, resources, probes, disruption budgets, and security contexts.
maintainers:
  - "@mishraomp"
  - "@DerekRoberts"
prerequisites:
  - Access to a BC Gov Private Cloud project for live validation
capabilities:
  filesystem:
    read:
      - workspace Kubernetes and OpenShift manifests
    write:
      - workspace Kubernetes and OpenShift manifests after confirmation
  network:
    - developer.gov.bc.ca
    - docs.openshift.com
    - github.com
    - kubernetes.io
    - registry.developer.gov.bc.ca
  commands:
    - kubectl
    - oc
  environment-variables:
    - S6_OVERLAY_VERSION
  secret-names: []
  data-classes:
    - INTERNAL
