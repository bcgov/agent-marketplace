schema-version: bcgov-extension/v1alpha1
id: bcgov-public/azure-networking
display-name: Azure Networking
summary: Design BC Gov Azure Landing Zone subnets, network security groups, service delegations, and private endpoints.
publisher: Province of British Columbia
maintainers:
  - "@mishraomp"
  - "@DerekRoberts"
support: https://github.com/bcgov/agent-marketplace/issues
license: Apache-2.0
lifecycle: active
prerequisites:
  - Access to the target BC Gov Azure Landing Zone project
capabilities:
  filesystem:
    read:
      - workspace infrastructure files
    write:
      - workspace infrastructure files after confirmation
  network:
    - raw.githubusercontent.com
    - learn.microsoft.com
    - citz-do.atlassian.net
  commands:
    - az
    - terraform
    - bicep
  environment-variables: []
  secret-names: []
  data-classes:
    - INTERNAL