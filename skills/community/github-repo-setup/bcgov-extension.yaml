display-name: GitHub Repository Setup
summary: Assess repository practices using an explicit local rubric, evidence gaps and scoring coverage.
maintainers:
  - "@mishraomp"
  - "@DerekRoberts"
prerequisites:
  - Supplied repository evidence; authorized GitHub metadata access is optional
capabilities:
  filesystem:
    read:
      - workspace source and configuration
    write:
      - MATURITY_REPORT.md after confirmation
  network:
    - api.github.com
    - github.com
  commands:
    - gh
  environment-variables:
    - GH_HOST
    - GH_REPO
  secret-names:
    - GH_TOKEN
    - GITHUB_TOKEN
  data-classes:
    - INTERNAL
