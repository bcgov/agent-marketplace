display-name: GitHub Actions
summary: Author and review GitHub Actions workflows using BC Gov permissions, pinning, fork validation and required-check patterns.
maintainers:
  - "@mishraomp"
  - "@DerekRoberts"
prerequisites:
  - A GitHub repository with Actions enabled
capabilities:
  filesystem:
    read:
      - workspace GitHub configuration
    write:
      - workspace GitHub configuration after confirmation
  network:
    - docs.github.com
  commands:
    - act
    - actionlint
    - make
    - shellcheck
    - yamllint
  environment-variables:
    - GITHUB_EVENT_NAME
    - GITHUB_SHA
    - GITHUB_REF
    - GITHUB_REPOSITORY
  secret-names:
    - GITHUB_TOKEN
  data-classes:
    - INTERNAL
