schema-version: bcgov-extension/v1alpha1
id: bcgov-public/github-actions
display-name: GitHub Actions
summary: Author and review GitHub Actions workflows using BC Gov permissions, pinning, fork-gate, and required-check patterns.
publisher: Province of British Columbia
maintainers:
  - "@mishraomp"
  - "@DerekRoberts"
support: https://github.com/bcgov/agent-marketplace/issues
license: Apache-2.0
lifecycle: active
prerequisites:
  - A GitHub repository with Actions enabled
capabilities:
  filesystem:
    read:
      - workspace GitHub configuration
    write:
      - workspace GitHub configuration after confirmation
  network:
    - docs.github.com
    - npm.pkg.github.com
  commands:
    - act
    - actionlint
    - make
    - shellcheck
    - yamllint
  environment-variables:
    - "*"
  secret-names:
    - GITHUB_TOKEN
  data-classes:
    - INTERNAL