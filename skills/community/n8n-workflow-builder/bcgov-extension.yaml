display-name: n8n Workflow Builder
summary: Compose reviewed runbook snippets into local and n8n operational triage workflows as reviewable fixed-input scaffolds; API publication is separate.
maintainers:
  - "@mishraomp"
  - "@DerekRoberts"
prerequisites:
  - Bash and jq
  - n8n access is required only for pull and push operations
capabilities:
  filesystem:
    read:
      - tools/n8n and selected cleaned snippets
    write:
      - selected config directory and generated workflows after confirmation
  network:
    - "*"
  commands:
    - bash
    - jq
    - curl
    - shellcheck
    - merge.sh
    - n8n-entrypoint.sh
    - pull.sh
    - push.sh
    - render.sh
    - report.sh
    - sync.sh
    - utils.sh
    - view.sh
  # Includes shell-local/template variable references recognized by the static scan.
  environment-variables:
    - BASH_REMATCH
    - BASH_SOURCE
    - CONFIG
    - DATA
    - DEST_DIR
    - DRY_RUN
    - FOO
    - GROUP
    - HELPERS
    - HERE
    - JSON
    - N8N
    - N8N_CONFIG
    - N8N_LOG_TAG
    - N8N_URL
    - N8N_WORKFLOWS_DIR
    - NAME
    - OUT
    - OUTDIR
    - PATH
    - PRUNE
    - ROOT
    - SCRIPT_DIR
    - SNIPPETS
    - TEMPLATE
    - VALS
    - VAR
    - WORKFLOWS_DIR
    - NAMESPACE
    - MERGE_ONE
    - MERGE_TWO
  secret-names:
    - N8N_API_KEY
  data-classes:
    - INTERNAL
    - CONFIDENTIAL
