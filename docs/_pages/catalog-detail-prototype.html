<!-- TITLE: Extension details prototype -->
<!-- NAV: catalog -->
<!-- Throwaway detail route for the direct-browse catalogue prototype. -->
<style>
  .extension-prototype-detail {
    max-width: 76rem;
    margin: 0 auto;
  }
  .extension-prototype-detail .back-link {
    display: inline-block;
    padding: .5rem 0;
    margin-bottom: 1.4rem;
  }
  .extension-prototype-detail .extension-summary {
    max-width: 72ch;
    font-size: 1.1rem;
  }
  .extension-prototype-detail .evidence-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.7fr) minmax(16rem, 1fr);
    gap: 1.5rem;
    margin-top: 2rem;
  }
  .extension-prototype-detail .evidence-panel {
    background: white;
    padding: clamp(1.25rem, 2.5vw, 2rem);
    border-radius: .4rem;
  }
  .extension-prototype-detail .evidence-panel h2:first-child { margin-top: 0; }
  .extension-prototype-detail .evidence-panel h2::before { display: none; }
  .extension-prototype-detail .evidence-panel + .evidence-panel { margin-top: 1.5rem; }
  .extension-prototype-detail dl > div {
    padding: .7rem 0;
    border-bottom: 1px solid #dfe5e9;
  }
  .extension-prototype-detail dt { font-weight: 700; color: #003366; }
  .extension-prototype-detail dd { margin: .2rem 0 0; overflow-wrap: anywhere; }
  .extension-prototype-detail .evidence-note {
    background: #e5eef5;
    padding: 1rem;
    border-left: 4px solid #003366;
    margin-top: 1rem;
  }
  .extension-prototype-detail .extension-links a { display: block; margin: .65rem 0; }
  .extension-prototype-detail pre { overflow: auto; padding: 1rem; background: #e5eef5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .extension-prototype-detail button {
    background: #003366;
    color: #fff;
    border: 0;
    border-radius: .25rem;
    min-height: 44px;
    padding: .6rem 1rem;
    font: inherit;
    cursor: pointer;
  }
  .extension-prototype-detail :focus-visible { outline: 3px solid #a35400; outline-offset: 3px; }
  @media (max-width: 760px) {
    .extension-prototype-detail .evidence-layout { grid-template-columns: 1fr; }
  }
</style>

<div class="extension-prototype-detail">
  <a class="back-link" href="catalog.html?variant=direct">Back to Extensions</a>
  <div id="extension-detail" role="status" aria-live="polite">Loading Extension details…</div>
</div>
<script>
(() => {
  const host = document.getElementById('extension-detail');
  const id = new URLSearchParams(location.search).get('id');
  const escape = value => String(value ?? '').replace(/[&<>"']/g, char => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]
  ));
  if (!id) {
    host.textContent = 'No Extension selected. Return to the catalogue and choose one.';
    return;
  }
  fetch('assets/catalog.json')
    .then(response => {
      if (!response.ok) throw new Error('Catalogue data did not load');
      return response.json();
    })
    .then(data => {
      const record = data.extensions.find(item => item.id === id);
      if (!record) {
        host.textContent = 'Extension not found in the published catalogue. Return to the catalogue to choose another.';
        return;
      }
      const source = record.source || {};
      const review = record.review || {};
      const policy = record.policy || {};
      const revision = source.revision || review.revision;
      const repository = source.repository;
      const path = source.path;
      const sourceLink = repository && revision && path ? `${repository}/tree/${revision}/${path}` : '';
      const historyLink = repository && path ? `${repository}/commits/main/${path}` : '';
      const status = review.status === 'domain-reviewed'
        ? 'Domain reviewed at this revision'
        : review.status === 'marketplace-reviewed'
          ? 'Reviewed at this revision'
          : review.status === 'auto-scanned'
            ? 'Auto-checked; no human review published'
            : 'No review evidence published';
      const findings = policy.findings || [];
      const capabilities = record.capabilities || {};
      const declared = [
        ['Commands', capabilities.commands],
        ['Network', capabilities.network],
        ['Writes', capabilities.filesystem?.write],
        ['Reads', capabilities.filesystem?.read],
        ['Data classes', capabilities['data-classes']],
        ['Secrets', capabilities['secret-names']],
        ['Environment', capabilities['environment-variables']]
      ];
      const installable = record.type === 'skill' && record.lifecycle === 'active' && repository && path && revision;
      const repoPath = repository?.replace(/^https:\/\/github\.com\//, '');
      const command = `apm install ${repoPath}/${path}#${revision} --target copilot`;
      const publisher = record.publisher || 'Not published';
      host.removeAttribute('role');
      host.removeAttribute('aria-live');
      host.innerHTML = `
        <h1>${escape(record['display-name'])}</h1>
        <p class="extension-summary">${escape(record.summary || '')}</p>
        <div class="evidence-layout">
          <div>
            <section class="evidence-panel">
              <h2>Review and scan evidence</h2>
              <p>${escape(status)}. A passed check is not a guarantee of safety.</p>
              <dl>
                <div><dt>Policy result</dt><dd>${escape(policy.outcome || 'Not available')}</dd></div>
                <div><dt>Findings on this revision</dt><dd>${findings.length
                  ? `<ul>${findings.map(finding => `<li>${escape(finding.severity || 'Finding')}: ${escape(finding.code || '')} — ${escape(finding.message || '')} (${escape(finding.path || 'path unavailable')}${finding.line ? `:${escape(finding.line)}` : ''})</li>`).join('')}</ul>`
                  : 'None published'}</dd></div>
                <div><dt>Access level</dt><dd>${escape(review.risk || 'Not available')}</dd></div>
                <div><dt>Reviewers</dt><dd>${escape((review.reviewers || []).join(', ') || 'No human reviewer published')}</dd></div>
                <div><dt>Scan method</dt><dd>${escape(review.method || 'Not available')}</dd></div>
                <div><dt>Policy version</dt><dd>${escape(policy['policy-version'] || 'Not available')}</dd></div>
                <div><dt>Content digest</dt><dd><code>${escape(record['content-digest'] || 'Not available')}</code></dd></div>
              </dl>
              <p class="evidence-note">Evidence applies to the published revision and digest above. Git history lists changes, not previous scan results.</p>
            </section>
            <section class="evidence-panel">
              <h2>Declared access</h2>
              <dl>${declared.map(([name, values]) => `<div><dt>${name}</dt><dd>${escape(values?.length ? values.join(', ') : 'None declared')}</dd></div>`).join('')}</dl>
            </section>
            <section class="evidence-panel">
              <h2>Install</h2>
              ${installable
                ? `<p>Pin the checked revision. Installation still requires your confirmation.</p><pre><code id="extension-install-command">${escape(command)}</code></pre><button type="button" id="extension-copy">Copy install command</button><p id="extension-copy-status" role="status"></p>`
                : '<p>No install command is published for this Extension type or lifecycle state.</p>'}
            </section>
          </div>
          <aside class="evidence-panel">
            <h2>About this Extension</h2>
            <dl>
              <div><dt>Type</dt><dd>${escape(record.type)}</dd></div>
              <div><dt>Specialty</dt><dd>${escape(record.specialty)}</dd></div>
              <div><dt>Publisher</dt><dd>${escape(publisher)}</dd></div>
              <div><dt>Maintainers</dt><dd>${escape((record.maintainers || []).join(', ') || 'Not published')}</dd></div>
              <div><dt>Published revision</dt><dd><code>${escape(revision || 'Not available')}</code></dd></div>
              <div><dt>License</dt><dd>${escape(record.license || 'Not published')}</dd></div>
            </dl>
            <div class="extension-links">
              ${sourceLink ? `<a href="${escape(sourceLink)}">Read source at this revision</a>` : ''}
              ${historyLink ? `<a href="${escape(historyLink)}">View source history</a>` : ''}
            </div>
            <p class="evidence-note">A maintainer is a contact, not necessarily the original author. An author by revision would require verified contribution provenance.</p>
          </aside>
        </div>`;
      document.title = `${record['display-name']} | BC Gov Agent Marketplace`;
      host.querySelector('#extension-copy')?.addEventListener('click', () => {
        navigator.clipboard.writeText(command)
          .then(() => { host.querySelector('#extension-copy-status').textContent = 'Install command copied.'; })
          .catch(() => { host.querySelector('#extension-copy-status').textContent = 'Could not copy the command. Select and copy the text above.'; });
      });
    })
    .catch(() => {
      host.textContent = 'Catalogue data could not be loaded. Reload this page or return to the catalogue.';
    });
})();
</script>
