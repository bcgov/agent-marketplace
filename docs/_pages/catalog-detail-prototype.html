<!-- TITLE: Extension details prototype -->
<!-- NAV: catalog -->
<!-- Throwaway detail route for the direct-browse catalogue prototype. -->
<style>
  .extension-prototype-detail {
    max-width: 76rem;
    margin: 0 auto;
  }
  .extension-prototype-detail .back-link {
    display: inline-block;
    padding: .5rem 0;
    margin-bottom: 1rem;
  }
  .extension-prototype-detail .detail-identity {
    font-size: .95rem;
    color: #475569;
    margin-bottom: .6rem;
  }
  .extension-prototype-detail .detail-intro {
    max-width: 68ch;
    font-size: 1.14rem;
    margin-bottom: 1.8rem;
  }
  .extension-prototype-detail .install-band {
    background: #003366;
    color: #fff;
    padding: clamp(1.25rem, 3vw, 2rem);
    border-bottom: 5px solid #fcba19;
  }
  .extension-prototype-detail .install-band h2,
  .extension-prototype-detail .install-band h2::before { color: #fff; background: none; }
  .extension-prototype-detail .install-band h2::before { display: none; }
  .extension-prototype-detail .install-band p { color: #e7eef7; }
  .extension-prototype-detail .install-band pre {
    margin: 1rem 0 .65rem;
    background: #eaf0f6;
    color: #172f49;
  }
  .extension-prototype-detail .install-band button { background: #fcba19; color: #003366; font-weight: 700; }
  .extension-prototype-detail .install-band [role="status"] { min-height: 1.5rem; }
  .extension-prototype-detail .detail-section { margin: 2rem 0; }
  .extension-prototype-detail .detail-section h2::before { display: none; }
  .extension-prototype-detail .detail-section h2 { margin: 0 0 .8rem; }
  .extension-prototype-detail .detail-section > p { max-width: 74ch; }
  .extension-prototype-detail .review-result {
    font-size: 1.14rem;
    font-weight: 700;
    color: #003366;
    margin-bottom: .45rem;
  }
  .extension-prototype-detail .evidence-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.5fr) minmax(17rem, 1fr);
    gap: 1.5rem;
    margin-top: 1.5rem;
  }
  .extension-prototype-detail .evidence-panel {
    background: white;
    padding: clamp(1.25rem, 2.5vw, 2rem);
    border-radius: .4rem;
  }
  .extension-prototype-detail .evidence-panel h2:first-child { margin-top: 0; }
  .extension-prototype-detail .evidence-panel h2::before { display: none; }
  .extension-prototype-detail .evidence-panel + .evidence-panel { margin-top: 1.5rem; }
  .extension-prototype-detail dl > div {
    padding: .7rem 0;
    border-bottom: 1px solid #dfe5e9;
  }
  .extension-prototype-detail dt { font-weight: 700; color: #003366; }
  .extension-prototype-detail dd { margin: .2rem 0 0; overflow-wrap: anywhere; }
  .extension-prototype-detail .evidence-note {
    background: #e5eef5;
    padding: 1rem;
    border-left: 4px solid #003366;
    margin-top: 1rem;
  }
  .extension-prototype-detail .extension-links a { display: block; margin: .65rem 0; }
  .extension-prototype-detail pre { overflow: auto; padding: 1rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .extension-prototype-detail button {
    background: #003366;
    color: #fff;
    border: 0;
    border-radius: .25rem;
    min-height: 44px;
    padding: .6rem 1rem;
    font: inherit;
    cursor: pointer;
  }
  .extension-prototype-detail :focus-visible { outline: 3px solid #a35400; outline-offset: 3px; }
  .extension-prototype-detail .related-list {
    padding: 0; list-style: none; display: grid; gap: .75rem;
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .extension-prototype-detail .related-list li { background: #fff; padding: 1rem; }
  .extension-prototype-detail .related-list a { display: block; font-size: 1.12rem; font-weight: 700; }
  .extension-prototype-detail .related-list span { display: block; margin-top: .35rem; color: #475569; }
  @media (max-width: 760px) {
    .extension-prototype-detail .evidence-layout,
    .extension-prototype-detail .related-list { grid-template-columns: 1fr; }
  }
</style>

<div class="extension-prototype-detail">
  <a class="back-link" href="catalog.html?variant=direct">Back to Extensions</a>
  <div id="extension-detail" role="status" aria-live="polite">Loading Extension details…</div>
</div>
<script>
(() => {
  const host = document.getElementById('extension-detail');
  const id = new URLSearchParams(location.search).get('id');
  const escape = value => String(value ?? '').replace(/[&<>"']/g, char => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]
  ));
  if (!id) {
    host.textContent = 'No Extension selected. Return to the catalogue and choose one.';
    return;
  }
  fetch('assets/catalog.json')
    .then(response => {
      if (!response.ok) throw new Error('Catalogue data did not load');
      return response.json();
    })
    .then(data => {
      const record = data.extensions.find(item => item.id === id);
      if (!record) {
        host.textContent = 'Extension not found in the published catalogue. Return to the catalogue to choose another.';
        return;
      }
      const source = record.source || {};
      const review = record.review || {};
      const policy = record.policy || {};
      const revision = source.revision || review.revision;
      const repository = source.repository;
      const path = source.path;
      const sourceLink = repository && revision && path ? `${repository}/tree/${revision}/${path}` : '';
      const historyLink = repository && path ? `${repository}/commits/main/${path}` : '';
      const status = review.status === 'domain-reviewed'
        ? 'Domain reviewed at this revision'
        : review.status === 'marketplace-reviewed'
          ? 'Reviewed at this revision'
          : review.status === 'auto-scanned'
            ? 'Auto-checked; no human review published'
            : 'No review evidence published';
      const findings = policy.findings || [];
      const capabilities = record.capabilities || {};
      const declared = [
        ['Commands', capabilities.commands],
        ['Network', capabilities.network],
        ['Writes', capabilities.filesystem?.write],
        ['Reads', capabilities.filesystem?.read],
        ['Data classes', capabilities['data-classes']],
        ['Secrets', capabilities['secret-names']],
        ['Environment', capabilities['environment-variables']]
      ];
      const installable = record.type === 'skill' && record.lifecycle === 'active' && repository && path && revision;
      const repoPath = repository?.replace(/^https:\/\/github\.com\//, '');
      const command = `apm install ${repoPath}/${path}#${revision} --target copilot`;
      const publisher = record.publisher || 'Not published';
      const sharedMaintainers = data.extensions
        .filter(item => item.id !== record.id && item.maintainers?.some(name => record.maintainers?.includes(name)));
      const related = sharedMaintainers
        .sort((a, b) => Number(b.specialty === record.specialty) - Number(a.specialty === record.specialty))
        .slice(0, 3);
      const advisoryCount = findings.filter(finding => finding.severity === 'advisory').length;
      const result = policy.outcome === 'passed'
        ? `Automated checks passed${advisoryCount ? ` with ${advisoryCount} ${advisoryCount === 1 ? 'advisory' : 'advisories'}` : ''}`
        : 'No passing automated check published';
      host.removeAttribute('role');
      host.removeAttribute('aria-live');
      host.innerHTML = `
        <p class="detail-identity">${escape(record.specialty)} / ${escape(record.type)}</p>
        <h1>${escape(record['display-name'])}</h1>
        <p class="detail-intro">${escape(record.summary || '')}</p>
        <section class="install-band" aria-labelledby="install-title">
          <h2 id="install-title">Install this Extension</h2>
          ${installable
            ? `<p>Use a command pinned to the checked revision. Installation still requires your confirmation.</p><pre><code id="extension-install-command">${escape(command)}</code></pre><button type="button" id="extension-copy">Copy install command</button><p id="extension-copy-status" role="status"></p>`
            : '<p>No install command is published for this Extension type or lifecycle state.</p>'}
        </section>
        <section class="detail-section" aria-labelledby="summary-title">
          <h2 id="summary-title">Before you install</h2>
          <p>${escape(record.prerequisites?.length ? record.prerequisites.join('; ') : 'No prerequisites declared.')}</p>
          ${sourceLink ? `<p><a href="${escape(sourceLink)}">Read its content at the published revision</a></p>` : ''}
        </section>
        <div class="evidence-layout">
          <section class="evidence-panel">
            <h2>What it can access</h2>
            <dl>${declared.map(([name, values]) => `<div><dt>${name}</dt><dd>${escape(values?.length ? values.join(', ') : 'None declared')}</dd></div>`).join('')}</dl>
          </section>
          <aside class="evidence-panel">
            <h2>Review and provenance</h2>
            <p class="review-result">${escape(result)}</p>
            <p>${escape(status)}. Neither result guarantees safety.</p>
            <dl>
              <div><dt>Access level</dt><dd>${escape(review.risk || 'Not available')}</dd></div>
              <div><dt>Reviewers</dt><dd>${escape((review.reviewers || []).join(', ') || 'No human reviewer published')}</dd></div>
              <div><dt>Publisher</dt><dd>${escape(publisher)}</dd></div>
              <div><dt>Maintainers</dt><dd>${escape((record.maintainers || []).join(', ') || 'Not published')}</dd></div>
              <div><dt>Published revision</dt><dd><code>${escape(revision || 'Not available')}</code></dd></div>
              <div><dt>Content digest</dt><dd><code>${escape(record['content-digest'] || 'Not available')}</code></dd></div>
              <div><dt>License</dt><dd>${escape(record.license || 'Not published')}</dd></div>
            </dl>
            <div class="extension-links">
              ${historyLink ? `<a href="${escape(historyLink)}">View source history</a>` : ''}
            </div>
            <p class="evidence-note">Evidence covers this revision only. Source history is not a scan archive. Maintainers are contacts, not verified original authors.</p>
          </aside>
        </div>
        ${related.length ? `<section class="detail-section" aria-labelledby="related-title">
          <h2 id="related-title">More from these maintainers</h2>
          <p>These Extensions share a listed maintainer with ${escape(record['display-name'])}.</p>
          <ul class="related-list">${related.map(item => `<li>
            <a href="catalog-detail-prototype.html?id=${encodeURIComponent(item.id)}">${escape(item['display-name'])}</a>
            <span>${escape(item.summary || '')}</span>
          </li>`).join('')}</ul>
        </section>` : ''}`;
      document.title = `${record['display-name']} | BC Gov Agent Marketplace`;
      host.querySelector('#extension-copy')?.addEventListener('click', () => {
        navigator.clipboard.writeText(command)
          .then(() => { host.querySelector('#extension-copy-status').textContent = 'Install command copied.'; })
          .catch(() => { host.querySelector('#extension-copy-status').textContent = 'Could not copy the command. Select and copy the text above.'; });
      });
    })
    .catch(() => {
      host.textContent = 'Catalogue data could not be loaded. Reload this page or return to the catalogue.';
    });
})();
</script>
