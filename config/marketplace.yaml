schema-version: bcgov-marketplace/v1alpha1
release-state: development
repository: https://github.com/bcgov/agent-marketplace
# Admin-owned activation; #43 proves live controls before enabling this.
publication:
  enabled: false
# Source dates are unknown at this reachable first-parent legacy baseline.
# Independent admin kill switch; shares publication readiness only.
dependency-intake:
  auto-merge: false
history-start: 246f032d1b99d594834e16e1654a37eb2c09ef56
# Additional anti-abuse limits for community auto-publishing. Organization
# membership is a required contributor gate for every active asset type.
community-intake:
  # How many brand-new packages one author may add within the window below.
  max-new-packages-per-window: 10
  window-days: 7
  # Submissions at or below this capability-risk band can auto-publish once the
  # scan passes and the author clears membership and new-Extension budget checks. Anything
  # riskier (for example wildcard capabilities) always waits for a maintainer.
  auto-publish-risk-ceiling: elevated
  auto-publish: false
approved-discovery-sources:
  - id: vercel-agent-skills
    name: Agent Skills Directory
    status: active
    extension-types: [skill]
    repository: https://github.com/vercel-labs/skills
    catalog: https://skills.sh/
  - id: microsoft-agent-skills
    name: Microsoft Agent Skills
    status: active
    extension-types: [skill]
    repository: https://github.com/microsoft/skills
    catalog: https://microsoft.github.io/skills/
  - id: anthropic-skills
    name: Anthropic Skills
    status: active
    extension-types: [skill]
    repository: https://github.com/anthropics/skills
    catalog: https://github.com/anthropics/skills
  - id: awesome-copilot
    name: Awesome Copilot
    status: active
    extension-types: [skill, prompt, instructions, agent]
    repository: https://github.com/github/awesome-copilot
    catalog: https://github.com/github/awesome-copilot